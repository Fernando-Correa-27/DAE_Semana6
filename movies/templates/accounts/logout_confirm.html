{% extends "movies/base.html" %}

{% block title %}Cerrar sesion{% endblock %}

{% block content %}
<div class="row justify-content-center text-center">
    <div class="col-12 col-sm-9 col-md-7 col-lg-5">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <i class="bi bi-box-arrow-right display-5 text-primary" aria-hidden="true"></i>

                <h1 class="h3 mt-3 mb-2">Cerrar sesion</h1>
                <p class="mb-4">&iquest;Seguro que quieres cerrar la sesion de
                    <strong>{{ user.username }}</strong>?
                </p>

                <form method="post">
                    {% csrf_token %}
                    <div class="d-grid gap-2 d-sm-flex justify-content-sm-center">
                        <button type="submit" class="btn btn-danger">
                            <i class="bi bi-box-arrow-right me-2" aria-hidden="true"></i>
                            Si, cerrar sesion
                        </button>
                        <a class="btn btn-outline-secondary" href="{% url 'movies:home' %}">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
