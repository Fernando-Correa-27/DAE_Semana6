{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Catalogo de Peliculas{% endblock %}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #f5f5f5;
            color: #333;
            line-height: 1.6;
        }
        header {
            background-color: #1a1a2e;
            color: #eaeaea;
            padding: 1.5rem 2rem;
        }
        header h1 { font-size: 1.5rem; }
        nav { margin-top: 0.5rem; }
        nav a {
            color: #a3a3c7;
            text-decoration: none;
            margin-right: 1.5rem;
            font-size: 0.9rem;
        }
        nav a:hover { color: #fff; }
        main {
            max-width: 960px;
            margin: 2rem auto;
            padding: 0 1rem;
        }
        .movie-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 1.5rem;
        }
        .movie-card {
            background: #fff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            transition: transform 0.2s;
        }
        .movie-card:hover { transform: translateY(-4px); }
        .movie-card img {
            width: 100%;
            height: 300px;
            object-fit: cover;
            background-color: #ddd;
        }
        .movie-card .info { padding: 1rem; }
        .movie-card h3 { font-size: 1rem; margin-bottom: 0.25rem; }
        .movie-card .year { color: #666; font-size: 0.85rem; }
        .movie-card .rating {
            color: #e5a00d;
            font-weight: bold;
            font-size: 0.9rem;
            margin-top: 0.5rem;
        }
        .movie-card .genres-list {
            margin-top: 0.5rem;
        }
        .movie-card .genre-tag {
            display: inline-block;
            background: #e8e8f0;
            color: #444;
            font-size: 0.75rem;
            padding: 0.15rem 0.5rem;
            border-radius: 12px;
            margin-right: 0.25rem;
        }
        .no-cover {
            width: 100%;
            height: 300px;
            background-color: #ddd;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #999;
            font-size: 0.9rem;
        }
        .empty-state {
            text-align: center;
            padding: 3rem;
            color: #888;
        }
        h2 {
            margin-bottom: 1.5rem;
            font-size: 1.3rem;
            border-bottom: 2px solid #1a1a2e;
            padding-bottom: 0.5rem;
        }
        .recommend-section { margin-top: 2rem; }
        .recommend-section h3 { margin-bottom: 1rem; }
        .back-link {
            display: inline-block;
            margin-bottom: 1rem;
            color: #1a1a2e;
            text-decoration: none;
            font-size: 0.9rem;
        }
        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <header>
        <h1>Catalogo de Peliculas</h1>
        <nav>
            <a href="{% url 'movies:home' %}">Todas</a>
            {% for genre in genres %}
            <a href="{% url 'movies:recommend' genre.name %}">{{ genre.name }}</a>
            {% endfor %}
        </nav>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
